# git-cliff: changelog and release notes from Conventional Commits.
# https://git-cliff.org/docs/configuration
#
#   npm run release:preview     # notes and version for the next release
#   git tag vX.Y.Z && git push origin vX.Y.Z

[changelog]
header = """
# Changelog

All notable changes to this project. Generated by [git-cliff](https://git-cliff.org) \
from [Conventional Commits](https://www.conventionalcommits.org).\n
"""
# URLs are spelled out instead of using git-cliff's GitHub integration, which would
# call the GitHub API on every run.
body = """
{%- set repo = "https://github.com/yinheli/xml-stream-format" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking_description != commit.message %} — {{ commit.breaking_description }}{% endif %}
{%- endfor %}
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope is not starting_with("deps") %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{%- if previous.version and version %}
**Full changelog**: [{{ previous.version }}...{{ version }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})
{% endif %}
"""
trim = true
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/yinheli/xml-stream-format/pull/${1}))" },
]

[git]
conventional_commits = true
# CI fails on commits that do not follow the convention (see .github/workflows/ci.yml).
require_conventional = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
# HTML comments only order the sections; they are stripped from the output.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|chore|ci)\\(deps(-dev)?\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build and CI" },
  { message = "^(chore|style)", group = "<!-- 8 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 9 -->Reverts" },
]

[bump]
features_always_bump_minor = true
# Before 1.0, a breaking change bumps the minor version (0.x semver convention).
breaking_always_bump_major = false
initial_tag = "v0.1.0"
