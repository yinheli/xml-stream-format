name: CI
on: [push, pull_request]
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
