name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    name: test (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Unreleased commits must follow Conventional Commits; they become the changelog.
  commits:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - run: npx git-cliff --unreleased > /dev/null
